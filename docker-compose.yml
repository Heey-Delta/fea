# Desenvolvimento local: Postgres no lugar do Neon, interface e worker.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fea
      POSTGRES_PASSWORD: fea
      POSTGRES_DB: fea
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fea"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fea:fea@postgres:5432/fea
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fea:fea@postgres:5432/fea
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
