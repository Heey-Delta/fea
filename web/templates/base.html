<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ferramenta de Operações{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="Menu principal">
      <div class="brand"><span class="brand-mark" aria-hidden="true">FO</span>Ferramenta de Operações</div>
      {% for item in menu %}
      <a class="nav{% if active == item.href %} on{% endif %}" href="{{ item.href }}">{{ item.label }}</a>
      {% endfor %}
      <div class="grow"></div>
      <form method="post" action="/logout">
        <button class="nav" type="submit">Sair</button>
      </form>
    </nav>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
