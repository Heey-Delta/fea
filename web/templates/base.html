<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EFO%3C/text%3E%3C/svg%3E">
  <title>{% block title %}Ferramenta de Operações{% endblock %} · FO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {{ icon_sprite() }}
  <div class="app">
    <nav class="side" aria-label="Menu principal">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">FO</span><span>Ferramenta de<br>Operações</span></a>
      <div class="side-sep"></div>
      {% for item in menu %}
      <a class="nav{% if active == item.href %} on{% endif %}" href="{{ item.href }}"{% if active == item.href %} aria-current="page"{% endif %}>{{ icon(item.icon) }}<span>{{ item.label }}</span></a>
      {% endfor %}
      <div class="grow"></div>
      <a class="side-card" href="/publicacoes">{{ icon('chart') }}<span>Estatísticas</span>{{ icon('chevron-right', 'end') }}</a>
      <form method="post" action="/logout">
        <button class="nav" type="submit">{{ icon('logout') }}<span>Sair</span></button>
      </form>
    </nav>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
