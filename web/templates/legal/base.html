<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EFO%3C/text%3E%3C/svg%3E">
  <title>{{ title }} · {{ operator }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <main class="main" style="max-width:760px;margin:0 auto">
    <div class="brand" style="padding:0 0 16px"><span class="brand-mark" aria-hidden="true">FO</span>{{ operator }}</div>
    <nav class="row chips" aria-label="Páginas públicas">
      {% for s, (label, _) in pages.items() %}<a class="chip{% if s == slug %} on{% endif %}" href="/{{ s }}">{{ label }}</a>{% endfor %}
      <a class="chip" href="/login">Entrar</a>
    </nav>
    <article class="card" style="gap:14px">
      <h1>{{ title }}</h1>
      <p class="sub">Atualizado em {{ updated }}.</p>
      {% block body %}{% endblock %}
      <p class="sub">Contato: {% if contact %}<a href="mailto:{{ contact }}">{{ contact }}</a>{% else %}pelo contato informado no cadastro do aplicativo em cada plataforma{% endif %}.</p>
    </article>
  </main>
</body>
</html>
